# Backend examples to copy into any config (under `backends:`). API keys come from environment variables.
backends:
  qwen:                         # open-weight model served by vLLM (see slurm/serve_vllm.sh)
    type: openai
    base_url: http://localhost:8000/v1
    model: qwen9b               # = --served-model-name, or the name of a LoRA adapter (--lora-modules name=path)
    max_tokens: 512
    temperature: 0.7
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  opus:
    type: anthropic
    model: claude-opus-5-5
    effort: low                 # thinking is always on for Opus 5.5; effort sets how much
    max_tokens: 4096
  sonnet:
    type: anthropic
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 4096
  gpt:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-6.1-sol
    max_tokens: 4096
    max_tokens_field: max_completion_tokens
    temperature: null
  gemini:
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model: gemini-3.1-pro-preview
    max_tokens: 4096
    temperature: null
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
    max_tokens: 4096
  mock:                         # no model: random legal JSON (pipeline dry runs)
    type: mock
    seed: 0
