# STEP 6 - final evaluation against frontier models (the only step that costs API money).
# A: frontier models zero-shot in the corrupt seats (vs heuristic police) - same seeds as step 2.
# B: frontier model as the honest police against the trained Qwen corrupt cop.
# Cost estimate for 200 full games: see the cost document; start with --episodes 20 to measure.
name: step6_frontier
out_dir: runs/step6_frontier
game: {variant: full, overrides: {radio_mode: exact, audit_prob: 0.0}}
history_events: 80
episodes: 200
seed_start: 10000
parallel_games: 8
save_transcripts: true
backends:
  qwen_trained:
    type: openai
    base_url: http://localhost:8000/v1
    model: trained
    max_tokens: 512
    temperature: 0.7
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  opus: {type: anthropic, model: claude-opus-5-5, effort: low, max_tokens: 4096}
  sonnet: {type: anthropic, model: claude-sonnet-5-5, effort: low, max_tokens: 4096}
  gpt: {type: openai, base_url: https://api.openai.com/v1, api_key_env: OPENAI_API_KEY, model: gpt-6.1-sol,
        max_tokens: 4096, max_tokens_field: max_completion_tokens, temperature: null}
  gemini: {type: openai, base_url: https://generativelanguage.googleapis.com/v1beta/openai,
           api_key_env: GEMINI_API_KEY, model: gemini-3.1-pro-preview, max_tokens: 4096, temperature: null}
seats:
  cop: {type: heuristic}
  thief: {type: heuristic}
cells:
  - {name: A_trained_qwen_corrupt, seats: {corrupt: {type: llm, backend: qwen_trained}}}
  - {name: A_opus_corrupt, seats: {corrupt: {type: llm, backend: opus}}}
  - {name: A_sonnet_corrupt, seats: {corrupt: {type: llm, backend: sonnet}}}
  - {name: A_gpt_corrupt, seats: {corrupt: {type: llm, backend: gpt}}}
  - {name: A_gemini_corrupt, seats: {corrupt: {type: llm, backend: gemini}}}
  - name: B_sonnet_police_vs_trained_qwen
    seats: {corrupt: {type: llm, backend: qwen_trained}, cop: {type: llm, backend: sonnet}}
  - name: B_heuristic_police_vs_trained_qwen
    seats: {corrupt: {type: llm, backend: qwen_trained}, cop: {type: heuristic}}
