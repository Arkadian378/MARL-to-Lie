<title>Corrupt Police Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: metro operations console. Map board left, radio/chat log right, transport controls on top, roster below. */
:root {
  --bg: #eef1f3;          /* transit-map paper, cool tint */
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #5d6b78;
  --rule: #d3dae0;
  --accent: #f2b705;      /* signage amber: pieces, highlights */
  --accent-ink: #3a2c00;
  --red: #d7263d; --blue: #1b6fd1; --green: #138a52; --thief: #111111; --thief-fill: #2b2b2b;
  --corrupt: #9b2fae;
  --clue: #e4572e;
  --line-op: 0.55;
  --station: #ffffff;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --panel: #161e26; --ink: #e6ecf1; --muted: #8d9aa6; --rule: #26313b;
  --accent: #ffc928; --accent-ink: #241a00; --red: #ff5a6e; --blue: #4d9cff; --green: #2fcf84;
  --thief: #f4f4f4; --thief-fill: #e9e9e9; --corrupt: #d27ae3; --clue: #ff7a50; --line-op: 0.5; --station: #0f151b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #161e26; --ink: #e6ecf1; --muted: #8d9aa6; --rule: #26313b;
  --accent: #ffc928; --accent-ink: #241a00; --red: #ff5a6e; --blue: #4d9cff; --green: #2fcf84;
  --thief: #f4f4f4; --thief-fill: #e9e9e9; --corrupt: #d27ae3; --clue: #ff7a50; --line-op: 0.5; --station: #0f151b;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between;
  border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: .9;
  letter-spacing: .01em; margin: 0; text-transform: uppercase; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.loaders { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
select, .filebtn { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; max-width: 100%; }
.filebtn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.filebtn input { display: none; }

.transport { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 12px; }
.btns { display: flex; gap: 4px; }
.btns button { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; min-width: 38px; height: 34px; font-family: var(--mono); font-weight: 600; }
.btns button.play { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 64px; }
.scrub { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.scrub input { width: 100%; accent-color: var(--accent); }
.ticks { position: relative; height: 14px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); }
.clock { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; display: flex; gap: 14px; align-items: baseline; }
.clock small { font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.goal { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.goal .bar { width: 120px; height: 10px; background: var(--rule); border-radius: 5px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.caption { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 4px; font-size: 15px; min-height: 44px;
  display: flex; gap: 10px; align-items: center; }
.caption .tag { font-family: var(--mono); font-size: 11px; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }

main.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 16px; margin-top: 14px; }
@media (max-width: 900px) { main.grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.map-wrap { position: relative; overflow-x: auto; }
svg.map { display: block; width: 100%; height: auto; min-width: 560px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

.side { display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px; font-family: var(--display); font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 4px; }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.feed { overflow-y: auto; height: 560px; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 900px) { .feed { height: 420px; } }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; font-family: var(--mono); }
.msg .who { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.msg .who b { color: var(--ink); font-size: 13px; }
.msg .bubble { margin-top: 2px; background: var(--bg); border-radius: 0 8px 8px 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.msg.dm .bubble { border: 1px dashed var(--corrupt); }
.msg.thought .bubble { font-style: italic; background: transparent; border-left: 3px solid var(--corrupt); border-radius: 0; color: var(--muted); }
.msg.report .bubble { font-family: var(--mono); font-size: 13px; }
.msg.lie .bubble { box-shadow: inset 3px 0 0 var(--clue); }
.chan { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--rule); }
.liebadge { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--clue); color: #fff; }
.sys { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 6px; display: flex; gap: 8px; }
.sys b { color: var(--ink); }
.sys.big { color: var(--ink); font-weight: 700; }
.roundsep { font-family: var(--display); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
.empty { color: var(--muted); font-size: 13px; padding: 20px 4px; }
.cur { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

section.roster { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.team { padding: 10px 12px; }
.team h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
.team h3 .vote { font-family: var(--body); font-size: 12px; font-weight: 400; color: var(--muted); text-transform: none; }
.pl { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.pl .st { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.role { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--rule); }
.role.corrupt { background: var(--corrupt); color: #fff; border-color: var(--corrupt); }
.role.thief { background: var(--thief-fill); color: var(--bg); border-color: var(--thief-fill); }
.role.unknown { color: var(--muted); }
.pl.out { opacity: .55; text-decoration: line-through; }
.payout { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }

.result { margin-top: 16px; padding: 14px 16px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.result div { display: flex; flex-direction: column; }
.result dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.result dd { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* map */
.st-dot { fill: var(--station); stroke: var(--ink); stroke-width: 1.4; }
.st-dot.hub { stroke-width: 2.4; }
.st-num { font-family: var(--mono); font-size: 7.5px; fill: var(--muted); pointer-events: none; }
.piece { fill: var(--accent); stroke: var(--accent-ink); stroke-width: .8; }
.clue-ring { fill: none; stroke: var(--clue); stroke-width: 2; stroke-dasharray: 3 2; }
.trail { fill: none; stroke: var(--thief); stroke-width: 2.2; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .75; }
.tok text { font-family: var(--mono); font-size: 8px; font-weight: 600; fill: #fff; pointer-events: none; }
.tok-thief text { fill: var(--bg); }
.pulse { fill: none; stroke: var(--accent); stroke-width: 3; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(.6); opacity: 1 } to { transform: scale(1.6); opacity: 0 } }
  .tok { transition: transform .35s ease; }
}
.arrest-x { stroke: var(--clue); stroke-width: 2.5; stroke-linecap: round; }
</style>

<header class="top">
  <div class="brand">
    <h1>Corrupt Police</h1>
    <p>Replay viewer for the CorruptPoliceBench social deduction game, after Day 1 of <i>The Devil's Plan: Death Room</i>.</p>
  </div>
  <div class="loaders">
    <div class="field"><label for="gameSel">Game</label><select id="gameSel"></select></div>
    <div class="field"><label for="povSel">Point of view</label><select id="povSel"></select></div>
    <div class="field"><label for="fileIn">Transcript</label>
      <label class="filebtn" for="fileIn">Open JSON…<input id="fileIn" type="file" accept=".json,application/json"></label></div>
  </div>
</header>

<div class="transport">
  <div class="clock"><span id="clkRound">R0</span><small id="clkPhase">setup</small></div>
  <div class="btns" role="group" aria-label="Playback">
    <button id="bRoundBack" title="Previous round">|◀</button>
    <button id="bBack" title="Previous event">◀</button>
    <button id="bPlay" class="play" title="Play or pause">Play</button>
    <button id="bFwd" title="Next event">▶</button>
    <button id="bRoundFwd" title="Next round">▶|</button>
  </div>
  <div class="field"><label for="speed">Speed</label>
    <select id="speed"><option value="1400">Slow</option><option value="650" selected>Normal</option><option value="250">Fast</option><option value="60">Very fast</option></select></div>
  <div class="scrub"><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Timeline"><div class="ticks" id="ticks"></div></div>
  <div class="goal"><span>Thieves</span><span class="bar"><i id="goalBar"></i></span><b id="goalTxt">0/12</b></div>
</div>

<div class="caption" id="caption"><span class="tag">EVENT</span><span id="capTxt">Load a transcript to start.</span></div>

<main class="grid">
  <div class="card">
    <div class="map-wrap"><svg class="map" id="map" role="img" aria-label="Subway board"></svg></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card side">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabChat" aria-selected="true">Chat</button>
      <button role="tab" id="tabLog" aria-selected="false">Game log</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="feed" id="feed" aria-live="polite"></div>
  </div>
</main>

<section class="roster" id="roster"></section>
<dl class="card result" id="result" hidden></dl>
<p class="note" id="note"></p>

<script type="application/json" id="embedded">/*__EMBED__*/[]</script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const TEAM_VAR = { red: "--red", blue: "--blue", green: "--green", thieves: "--thief-fill" };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const GOD = "__god__";

let T = null, frames = [], visIdx = [], pos = 0, timer = null, pov = GOD;
let tab = "chat", chanFilter = "all";
const games = [];

// ---------- loading
function addGame(t, label) {
  games.push({ t, label: label || (t.meta && t.meta.title) || ("seed " + (t.config && t.config.seed)) });
  const o = document.createElement("option");
  o.value = games.length - 1; o.textContent = games[games.length - 1].label;
  $("#gameSel").appendChild(o);
}
try { JSON.parse($("#embedded").textContent).forEach(t => addGame(t)); } catch (e) { console.warn(e); }

async function tryFetchIndex() {
  try {
    const r = await fetch("data/index.json"); if (!r.ok) return;
    for (const it of await r.json()) {
      const rr = await fetch("data/" + it.file); if (rr.ok) addGame(await rr.json(), it.title);
    }
  } catch (e) { /* standalone mode */ }
}

$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const t = JSON.parse(rd.result); addGame(t, f.name); $("#gameSel").value = games.length - 1; load(games.length - 1); }
    catch (err) { $("#capTxt").textContent = "That file is not a valid transcript JSON: " + err.message; }
  };
  rd.readAsText(f);
});
$("#gameSel").addEventListener("change", e => load(+e.target.value));

// ---------- state reconstruction
function buildFrames(t) {
  const st = { cops: {}, thieves: {}, pieces: new Set(), trails: {}, clues: [], arrested: new Set(), carried: {},
               round: 0, phase: "setup", fails: [], votes: {}, over: null, payout: null, total: 0 };
  const out = [];
  for (const e of t.events) {
    const d = e.data;
    st.round = e.round; st.phase = e.phase;
    switch (e.type) {
      case "pieces_placed": d.stations.forEach(s => st.pieces.add(s)); break;
      case "police_placed": Object.assign(st.cops, d.positions); break;
      case "thieves_placed": for (const [k, v] of Object.entries(d.positions)) { st.thieves[k] = v; st.trails[k] = [v]; st.carried[k] = 0; } break;
      case "thief_moved": st.thieves[d.agent] = d.station; st.trails[d.agent] = (st.trails[d.agent] || []).concat(d.path);
        d.picked.forEach(s => st.pieces.delete(s)); st.carried[d.agent] = d.carried; break;
      case "investigation": st.cops[d.agent] = d.station; break;
      case "arrest_failed": st.cops[d.agent] = d.station; st.fails = st.fails.concat([{ s: d.station, r: e.round }]); break;
      case "thief_arrested": st.cops[d.agent] = d.station; st.arrested.add(d.thief); st.carried[d.thief] = 0; break;
      case "clue_shared": st.clues = st.clues.concat([d.station]); break;
      case "vote_result": st.votes[d.team] = d; break;
      case "game_over": st.over = d; break;
      case "payout": st.payout = d.payout; break;
    }
    st.total = Object.entries(st.carried).filter(([k]) => !st.arrested.has(k)).reduce((a, [, v]) => a + v, 0);
    out.push({ cops: { ...st.cops }, thieves: { ...st.thieves }, pieces: new Set(st.pieces), trails: JSON.parse(JSON.stringify(st.trails)),
      clues: st.clues, arrested: new Set(st.arrested), carried: { ...st.carried }, round: st.round, phase: st.phase,
      fails: st.fails, votes: { ...st.votes }, over: st.over, payout: st.payout, total: st.total });
  }
  return out;
}
const visible = (e, who) => who === GOD || e.vis === "all" || (Array.isArray(e.vis) && e.vis.includes(who));

function knownRoles(who, upto) {
  const kr = {};
  if (who === GOD) { T.players.forEach(p => kr[p.id] = p.role); return kr; }
  for (let i = 0; i <= upto && i < T.events.length; i++) {
    const e = T.events[i]; if (!visible(e, who)) continue;
    if (e.type === "role_assigned" && e.data.agent === who) kr[who] = e.data.role === "corrupt" ? "corrupt" : e.data.role;
    if (e.type === "thieves_revealed") e.data.thieves.forEach(x => kr[x] = "thief");
    if (e.type === "corrupt_revealed") e.data.corrupt.forEach(x => kr[x] = "corrupt");
    if (e.type === "payout") Object.assign(kr, e.data.roles);
  }
  return kr;
}

// ---------- map
let geo = null;
function drawMapBase() {
  const svg = $("#map"); svg.innerHTML = "";
  const S = T.board.stations, k = 34, pad = 26;
  const xs = S.map(s => s.x), ys = S.map(s => s.y);
  const minx = Math.min(...xs), miny = Math.min(...ys);
  const W = (Math.max(...xs) - minx) * k + pad * 2, H = (Math.max(...ys) - miny) * k + pad * 2;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const P = {}; S.forEach(s => P[s.id] = [(s.x - minx) * k + pad, (s.y - miny) * k + pad]);
  geo = { P, byId: Object.fromEntries(S.map(s => [s.id, s])) };
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent = svg) => { const el = document.createElementNS(NS, tag); for (const a in attrs) el.setAttribute(a, attrs[a]); parent.appendChild(el); return el; };
  const gl = mk("g", { id: "lines" });
  T.board.lines.forEach(l => {
    const seq = l.loop ? l.stations.concat([l.stations[0]]) : l.stations;
    mk("polyline", { points: seq.map(i => P[i].join(",")).join(" "), fill: "none", stroke: l.color, "stroke-width": 6,
      "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-opacity": css("--line-op") || .55 }, gl);
  });
  mk("g", { id: "trails" }); mk("g", { id: "marks" });
  const gs = mk("g", { id: "stations" });
  S.forEach(s => {
    const [x, y] = P[s.id], hub = s.lines.length > 1;
    const c = mk("circle", { cx: x, cy: y, r: hub ? 6 : 4.2, class: "st-dot" + (hub ? " hub" : "") }, gs);
    const ttl = document.createElementNS(NS, "title"); ttl.textContent = `${s.id} ${s.name} (${s.lines.join(", ")})`; c.appendChild(ttl);
    mk("text", { x: x + 6, y: y - 6, class: "st-num" }, gs).textContent = s.id;
  });
  mk("g", { id: "pieces" }); mk("g", { id: "tokens" }); mk("g", { id: "fx" });
  const lg = $("#legend");
  lg.innerHTML = `<span><i class="sw" style="background:var(--red)"></i>Red team</span><span><i class="sw" style="background:var(--blue)"></i>Blue team</span>
    <span><i class="sw" style="background:var(--green)"></i>Green team</span><span><i class="sw" style="background:var(--thief-fill);transform:rotate(45deg)"></i>Thief</span>
    <span><i class="sw" style="background:var(--accent);border-radius:50%"></i>Piece</span><span><i class="sw" style="border:2px dashed var(--clue);border-radius:50%"></i>Public clue</span>
    <span><i class="sw" style="border:2px solid var(--corrupt)"></i>Corrupt (revealed)</span>`;
}

function drawMapState(f, ev, kr) {
  const NS = "http://www.w3.org/2000/svg", P = geo.P;
  const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const a in attrs) el.setAttribute(a, attrs[a]); parent.appendChild(el); return el; };
  const role = pov === GOD ? "god" : (T.players.find(p => p.id === pov) || {}).role;
  const seeThieves = role === "god" || role === "thief" || role === "corrupt";
  const seePieces = role === "god" || role === "thief";
  // pieces
  const gp = $("#pieces"); gp.innerHTML = "";
  if (seePieces) f.pieces.forEach(s => { const [x, y] = P[s];
    mk("path", { d: `M${x} ${y - 6} L${x + 5.2} ${y - 3} L${x + 5.2} ${y + 3} L${x} ${y + 6} L${x - 5.2} ${y + 3} L${x - 5.2} ${y - 3} Z`, class: "piece" }, gp); });
  // clues and failed arrests (public)
  const gm = $("#marks"); gm.innerHTML = "";
  f.clues.forEach(s => { const [x, y] = P[s]; mk("circle", { cx: x, cy: y, r: 10, class: "clue-ring" }, gm); });
  f.fails.filter(a => a.r === f.round).forEach(a => { const [x, y] = P[a.s];
    mk("path", { d: `M${x - 5} ${y - 5} L${x + 5} ${y + 5} M${x + 5} ${y - 5} L${x - 5} ${y + 5}`, class: "arrest-x" }, gm); });
  // trails
  const gt = $("#trails"); gt.innerHTML = "";
  if (seeThieves && (role === "god" || role === "thief"))
    Object.entries(f.trails).forEach(([k, tr]) => { if (tr.length > 1) mk("polyline", { points: tr.map(i => P[i].join(",")).join(" "), class: "trail" }, gt); });
  // tokens, fanned out per station
  const gk = $("#tokens"); gk.innerHTML = "";
  const at = {};
  const team = Object.fromEntries(T.players.map(p => [p.id, p.team]));
  Object.entries(f.cops).forEach(([id, s]) => (at[s] = at[s] || []).push({ id, kind: "cop" }));
  if (seeThieves) Object.entries(f.thieves).forEach(([id, s]) => { if (!f.arrested.has(id)) (at[s] = at[s] || []).push({ id, kind: "thief" }); });
  Object.entries(at).forEach(([s, list]) => {
    const [x0, y0] = P[s];
    list.forEach((tk, i) => {
      const n = list.length, ang = n === 1 ? -Math.PI / 4 : (i / n) * Math.PI * 2 - Math.PI / 2, rr = 13;
      const x = x0 + Math.cos(ang) * rr, y = y0 + Math.sin(ang) * rr;
      const g = mk("g", { class: "tok" + (tk.kind === "thief" ? " tok-thief" : ""), transform: `translate(${x},${y})` }, gk);
      mk("line", { x1: 0, y1: 0, x2: x0 - x, y2: y0 - y, stroke: css("--muted"), "stroke-width": .8 }, g);
      if (tk.kind === "thief") {
        mk("rect", { x: -7, y: -7, width: 14, height: 14, transform: "rotate(45)", fill: css("--thief-fill"), stroke: css("--accent"), "stroke-width": 1.5 }, g);
      } else {
        const corrupt = kr[tk.id] === "corrupt";
        mk("rect", { x: -8, y: -7, width: 16, height: 14, rx: 3, fill: css(TEAM_VAR[team[tk.id]] || "--muted"),
          stroke: corrupt ? css("--corrupt") : css("--panel"), "stroke-width": corrupt ? 2.6 : 1.2 }, g);
      }
      mk("text", { x: 0, y: 3, "text-anchor": "middle" }, g).textContent = tk.id.slice(0, 2);
      const ttl = document.createElementNS(NS, "title"); ttl.textContent = `${tk.id} @ ${s}`; g.appendChild(ttl);
    });
  });
  // focus pulse on current event's station
  const gf = $("#fx"); gf.innerHTML = "";
  const s = ev && (ev.data.station ?? null);
  if (s != null && P[s] && (ev.type !== "thief_moved" || seeThieves)) { const [x, y] = P[s]; mk("circle", { cx: x, cy: y, r: 12, class: "pulse" }, gf); }
}

// ---------- text
const tn = s => String(s).replace(/_/g, " ");
function describe(e) {
  const d = e.data;
  switch (e.type) {
    case "game_start": return `Game starts. ${d.n_players} players, ${d.n_pieces} hidden pieces, thieves need ${d.goal}.`;
    case "role_assigned": return `${d.agent} draws the role: ${tn(d.role)}${d.team && d.team !== "thieves" ? ` (team ${d.team})` : ""}.`;
    case "teams": return "Police teams are formed: " + Object.entries(d.teams).map(([k, v]) => `${k}: ${v.join(", ")}`).join(" · ");
    case "thieves_revealed": return `The thieves are ${d.thieves.join(" and ")}.`;
    case "corrupt_revealed": return `Secret: the corrupt cops are ${d.corrupt.join(" and ")}.`;
    case "pieces_placed": return `Secret: ${d.stations.length} pieces are hidden on the board.`;
    case "police_placed": return "Police tokens are placed and shown to everyone.";
    case "thieves_placed": return "Thieves choose their hidden starting stations.";
    case "round_start": return `Round ${d.round} begins.`;
    case "thief_moved": return `${d.agent} moves ${d.path.length ? d.path.join(" → ") : "nowhere"}${d.picked.length ? `, picks up ${d.picked.length} piece${d.picked.length > 1 ? "s" : ""}` : ""} (carrying ${d.carried}).`;
    case "radio": return "Radio to corrupt cops: " + Object.entries(d.positions).map(([k, v]) => `${k} at ${v}`).join(", ") + ".";
    case "police_order": return "Police order this round: " + d.order.join(" → ") + ".";
    case "investigation": return `${d.agent} (${d.team}) investigates station ${d.station}.`;
    case "investigation_result": return `${d.agent} privately learns: station ${d.station} has ${d.result === "clue" ? "a clue" : "no clue"}.`;
    case "team_report": return `${d.agent} tells the team: station ${d.station} ${d.claim === "clue" ? "has a clue" : "is clean"}.`;
    case "clue_shared": return `Verified public clue at station ${d.station}, shared by ${d.agent}.`;
    case "arrest_failed": return `${d.agent} (${d.team}) attempts an arrest at station ${d.station}. It fails.`;
    case "corrupt_arrest_blocked": return `Behind the scenes: ${d.agent} is corrupt, so the arrest at ${d.station} could not catch ${d.thieves.join(", ")}.`;
    case "thief_arrested": return `${d.agent} (${d.team}) arrests ${d.thief} at station ${d.station}! ${d.pieces_lost} pieces are lost.`;
    case "thief_total_revealed": return `Announcement: free thieves hold ${d.total} pieces.`;
    case "round_end": return `Round ${d.round} ends.`;
    case "game_over": return `Game over: ${tn(d.reason)} after round ${d.round}.`;
    case "vote_result": return `Team ${d.team} votes and names ${d.named === "none" ? "nobody" : d.named}. ${d.correct ? "Correct." : `Wrong: the corrupt cop was ${d.corrupt_was === "none" ? "nobody" : d.corrupt_was}.`}`;
    case "payout": return "Final payout of pieces.";
    case "chat": return `${d.agent} (${d.channel}): ${d.text}`;
    case "thought": return `${d.agent} thinks: ${d.text}`;
    case "invalid_action": return `${d.agent} made an invalid ${d.kind}: ${d.why}`;
  }
  return tn(e.type);
}

// ---------- feed
const CHAT_TYPES = new Set(["chat", "team_report", "thought"]);
const SYS_BIG = new Set(["thief_arrested", "clue_shared", "thief_total_revealed", "game_over", "vote_result", "corrupt_arrest_blocked"]);
const SYS_CHAT = new Set(["thief_arrested", "clue_shared", "thief_total_revealed", "game_over", "vote_result", "arrest_failed", "round_start"]);
function channelKey(e) {
  if (e.type === "thought") return "thoughts";
  if (e.type === "team_report") return "team:" + teamOf(e.data.agent);
  const c = e.data.channel; return c.startsWith("dm:") ? "dm" : c;
}
const teamOf = id => (T.players.find(p => p.id === id) || {}).team;
function avatar(id) {
  const t = teamOf(id);
  return `<div class="avatar" style="background:var(${TEAM_VAR[t] || "--muted"});${t === "thieves" ? "color:var(--bg)" : ""}">${id.slice(0, 2)}</div>`;
}
function claimLie(e) {
  // a team report is a lie when it differs from the reporter's private result for that station
  if (e.type !== "team_report") return false;
  for (let i = e.t - 1; i >= 0; i--) { const x = T.events[i];
    if (x.type === "investigation_result" && x.data.agent === e.data.agent && x.data.station === e.data.station) return x.data.result !== e.data.claim; }
  return false;
}
function renderChips() {
  const opts = [["all", "All"], ["public", "Public"]];
  const teams = Object.keys(T.teams);
  const pteam = pov === GOD ? null : teamOf(pov);
  teams.forEach(t => { if (pov === GOD || t === pteam) opts.push(["team:" + t, t === "thieves" ? "Thieves" : "Team " + t]); });
  opts.push(["dm", "Private"]);
  if (pov === GOD) opts.push(["thoughts", "Thoughts"]);
  if (!opts.some(o => o[0] === chanFilter)) chanFilter = "all";
  $("#chips").innerHTML = opts.map(([k, l]) => `<button class="chip" data-k="${k}" aria-pressed="${k === chanFilter}">${l}</button>`).join("");
  $("#chips").hidden = tab !== "chat";
}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; chanFilter = b.dataset.k; renderChips(); renderFeed(); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderFeed() {
  const feed = $("#feed"), cur = visIdx[pos];
  const rows = [];
  let lastRound = -1;
  for (let i = 0; i <= cur; i++) {
    const e = T.events[i];
    if (!visible(e, pov)) continue;
    let html = null;
    if (tab === "chat") {
      if (CHAT_TYPES.has(e.type)) {
        const ck = channelKey(e);
        if (chanFilter !== "all" && chanFilter !== ck) continue;
        const d = e.data, lie = pov === GOD && claimLie(e);
        const label = e.type === "thought" ? "private thought" : e.type === "team_report" ? "report → team " + teamOf(d.agent)
          : d.channel.startsWith("dm:") ? "DM → " + d.channel.slice(3) : d.channel.replace("team:", "team ");
        const body = e.type === "team_report" ? `Station ${d.station}: ${d.claim === "clue" ? "CLUE" : "no clue"}${d.note ? " · " + esc(d.note) : ""}` : esc(d.text);
        const cls = ["msg", e.type === "thought" ? "thought" : "", e.type === "team_report" ? "report" : "", d.channel && d.channel.startsWith("dm:") ? "dm" : "", lie ? "lie" : ""].join(" ");
        html = `<div class="${cls}${i === cur ? " cur" : ""}">${avatar(d.agent)}<div style="min-width:0"><div class="who"><b>${esc(d.agent)}</b><span class="chan">${esc(label)}</span>${lie ? '<span class="liebadge">LIE</span>' : ""}</div><div class="bubble">${body}</div></div></div>`;
      } else if (SYS_CHAT.has(e.type) && chanFilter === "all") {
        if (e.type === "round_start") { html = `<div class="roundsep">Round ${e.data.round}</div>`; }
        else html = `<div class="sys${SYS_BIG.has(e.type) ? " big" : ""}${i === cur ? " cur" : ""}"><span>◆</span><span>${esc(describe(e))}</span></div>`;
      }
    } else {
      if (e.type === "round_start") html = `<div class="roundsep">Round ${e.data.round}</div>`;
      else html = `<div class="sys${SYS_BIG.has(e.type) ? " big" : ""}${i === cur ? " cur" : ""}"><span>#${e.t}</span><span>${esc(describe(e))}</span></div>`;
    }
    if (html) rows.push(html);
  }
  feed.innerHTML = rows.length ? rows.join("") : `<div class="empty">No messages yet at this point of the game for this point of view.</div>`;
  feed.scrollTop = feed.scrollHeight;
}
function setTab(t) { tab = t; $("#tabChat").setAttribute("aria-selected", t === "chat"); $("#tabLog").setAttribute("aria-selected", t === "log"); renderChips(); renderFeed(); }
$("#tabChat").onclick = () => setTab("chat"); $("#tabLog").onclick = () => setTab("log");

// ---------- roster and result
function renderRoster(f, kr) {
  const teams = Object.entries(T.teams);
  $("#roster").innerHTML = teams.map(([t, ms]) => {
    const vote = f.votes[t] ? `voted: ${f.votes[t].named}` : "";
    return `<div class="card team"><h3 style="color:var(${TEAM_VAR[t]})"><span>${t === "thieves" ? "Thieves" : "Team " + t}</span><span class="vote">${esc(vote)}</span></h3>` +
      ms.map(m => {
        const r = kr[m] || "unknown", isThief = t === "thieves";
        const stn = isThief ? ((pov === GOD || kr[pov] === "thief" || (pov !== GOD && kr[pov] === "corrupt")) ? f.thieves[m] : "?") : f.cops[m];
        const label = r === "cop" ? "police" : r === "unknown" ? "police?" : r;
        const extra = f.payout ? `<span class="payout">${f.payout[m]} pc</span>` : isThief ? `<span class="payout">${f.carried[m] ?? 0} pc</span>` : `<span></span>`;
        return `<div class="pl${f.arrested.has(m) ? " out" : ""}"><span>${esc(m)}${m === pov ? " (you)" : ""} <span class="st">@${stn ?? "–"}</span></span><span class="role ${r}">${label}</span>${extra}</div>`;
      }).join("") + `</div>`;
  }).join("");
  const res = $("#result");
  if (f.payout && T.metrics) {
    const m = T.metrics;
    const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
    res.hidden = false;
    res.innerHTML = [["End", tn(m.end_reason)], ["Rounds", m.rounds], ["Thief pieces", m.thief_pieces_final], ["Arrests", m.thieves_arrested],
      ["Corrupt exposed", pct(m.corrupt_detection_rate)], ["False accusations", m.false_accusations], ["Corrupt lie rate", pct((m.report_lie_rate || {}).corrupt)],
      ["Fake arrests", m.fake_arrests], ["Collusion DMs", m.collusion_messages]].map(([a, b]) => `<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join("");
  } else res.hidden = true;
}

// ---------- main render
function render() {
  if (!T) return;
  const i = visIdx[pos], f = frames[i], e = T.events[i];
  const kr = knownRoles(pov, i);
  $("#clkRound").textContent = "R" + f.round; $("#clkPhase").textContent = tn(f.phase);
  const goal = T.config.thief_piece_goal;
  const showTotal = pov === GOD || kr[pov] === "thief" || kr[pov] === "corrupt";
  $("#goalBar").style.width = showTotal ? Math.min(100, f.total / goal * 100) + "%" : "0%";
  $("#goalTxt").textContent = showTotal ? `${f.total}/${goal}` : `?/${goal}`;
  $("#capTxt").textContent = describe(e);
  $(".caption .tag").textContent = `#${e.t} · ${tn(e.type)}`;
  $("#scrub").value = pos;
  drawMapState(f, e, kr); renderFeed(); renderRoster(f, kr);
  $("#bPlay").textContent = timer ? "Pause" : "Play";
}
function computeVis() {
  const prevEvent = visIdx.length ? visIdx[pos] : 0;
  visIdx = T.events.map((e, i) => i).filter(i => visible(T.events[i], pov));
  pos = Math.max(0, visIdx.findIndex(i => i >= prevEvent)); if (pos < 0) pos = 0;
  $("#scrub").max = visIdx.length - 1;
  const ticks = $("#ticks"); ticks.innerHTML = "";
  visIdx.forEach((ei, k) => { const e = T.events[ei];
    if (e.type === "round_start" && (e.data.round % 3 === 0 || e.data.round === 1)) {
      const s = document.createElement("span"); s.style.left = (k / Math.max(1, visIdx.length - 1) * 100) + "%"; s.textContent = "R" + e.data.round; ticks.appendChild(s); } });
}
function load(gi) {
  stop(); T = games[gi].t; frames = buildFrames(T); visIdx = [];
  const sel = $("#povSel"); sel.innerHTML = `<option value="${GOD}">Director (sees everything)</option>` +
    T.players.map(p => `<option value="${esc(p.id)}">${esc(p.id)} · ${p.team === "thieves" ? "thief" : "team " + p.team}</option>`).join("");
  pov = GOD; drawMapBase(); computeVis();
  // open on an interesting moment: first round's police phase
  const k = visIdx.findIndex(i => T.events[i].type === "police_order"); pos = k > 0 ? k : 0;
  const cfg = T.config;
  $("#note").textContent = `Seed ${cfg.seed} · ${T.board.stations.length} stations · ${cfg.n_teams} teams of ${cfg.team_size} · agents: ${(T.meta && T.meta.agents) || "unknown"}. ` +
    "Chat lines tagged LIE are team reports that contradict the speaker's own private investigation; tags appear only in Director view.";
  renderChips(); render();
}
$("#povSel").addEventListener("change", e => { pov = e.target.value; computeVis(); renderChips(); render(); });

// ---------- transport
function go(p) { pos = Math.max(0, Math.min(visIdx.length - 1, p)); render(); }
function stop() { if (timer) clearInterval(timer); timer = null; }
function play() { stop(); timer = setInterval(() => { if (pos >= visIdx.length - 1) { stop(); render(); return; } go(pos + 1); }, +$("#speed").value); render(); }
$("#bPlay").onclick = () => timer ? (stop(), render()) : play();
$("#speed").onchange = () => { if (timer) play(); };
$("#bFwd").onclick = () => go(pos + 1); $("#bBack").onclick = () => go(pos - 1);
const roundJump = dir => { let p = pos + dir;
  while (p > 0 && p < visIdx.length - 1 && T.events[visIdx[p]].type !== "round_start") p += dir; go(p); };
$("#bRoundFwd").onclick = () => roundJump(1); $("#bRoundBack").onclick = () => roundJump(-1);
$("#scrub").addEventListener("input", e => { stop(); go(+e.target.value); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select")) return;
  if (e.key === "ArrowRight") go(pos + 1); else if (e.key === "ArrowLeft") go(pos - 1);
  else if (e.key === " ") { e.preventDefault(); $("#bPlay").click(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (T) { drawMapBase(); render(); } });
new MutationObserver(() => { if (T) { drawMapBase(); render(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

if (games.length) load(0);
if (!games.length) tryFetchIndex().then(() => { if (!T && games.length) load(0); });
})();
</script>
